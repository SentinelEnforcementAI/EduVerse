# One-off demo tidy-ups against the live database, run as an ECS task:
#   1. Rename the demo leadership account to a credible persona (Sarah Lewis).
#   2. Detach the Wonde sandbox tenant from the demo trust so it no longer shows
#      on product screens (its data and Wonde link are kept — reversible).
#
# Idempotent and non-destructive: nothing is hard-deleted. Type APPLY to run so
# it can't be triggered by an accidental click.
name: Demo fix-ups

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY to confirm the demo data fix-ups
        required: true
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  PROJECT: sentinel-watch

permissions:
  contents: read

jobs:
  fixups:
    name: Apply demo fix-ups
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then
            echo "Confirmation not given (type APPLY). Nothing was changed."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run demo fix-ups (one-off task, owner role)
        run: |
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=$PROJECT-private-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$PROJECT-worker-*" \
            --query 'SecurityGroups[0].GroupId' --output text)

          OVERRIDES='{"containerOverrides":[{"name":"migrate","command":["pnpm","--filter","@sentinel/db","db:demo:fixups:prod"]}]}'

          TASK_ARN=$(aws ecs run-task \
            --cluster "$PROJECT" \
            --task-definition "$PROJECT-migrate" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)

          echo "Fix-up task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$PROJECT" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$PROJECT" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Fix-ups failed (exit $EXIT_CODE) — check /ecs/$PROJECT/worker logs (migrate prefix)"
            exit 1
          fi
          echo "Demo fix-ups applied."
