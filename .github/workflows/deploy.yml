# Manual deploy to AWS eu-west-2 (ECS Fargate). Trigger from the Actions tab
# once the infrastructure exists (see infra/README.md).
#
# Required repository configuration:
#   secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (same key the
#   Bootstrap workflow uses).
#
# CTO-DECISION: switch to a GitHub-OIDC-assumable IAM role (no long-lived
# keys) and automatic deploys on merge to main. Manual dispatch with the
# bootstrap key is the simplest working version.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  PROJECT: sentinel-watch

permissions:
  contents: read

jobs:
  deploy:
    name: Build, migrate, release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f apps/web/Dockerfile \
            -t "$REGISTRY/$PROJECT/web:$TAG" -t "$REGISTRY/$PROJECT/web:latest" .
          docker build -f Dockerfile.worker \
            -t "$REGISTRY/$PROJECT/worker:$TAG" -t "$REGISTRY/$PROJECT/worker:latest" .
          docker push --all-tags "$REGISTRY/$PROJECT/web"
          docker push --all-tags "$REGISTRY/$PROJECT/worker"

      - name: Realign owner DB secret with the current master password
        run: |
          # The RDS master password is AWS-managed and rotates on a schedule.
          # The owner connection string is a copy, so re-derive it from the
          # current master secret before migrations, else migrate deploy fails
          # P1000 (authentication failed for sentinel_owner) after a rotation.
          MASTER_ARN=$(aws rds describe-db-instances --db-instance-identifier "$PROJECT-db" \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
          ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier "$PROJECT-db" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          CREDS=$(aws secretsmanager get-secret-value --secret-id "$MASTER_ARN" \
            --query SecretString --output text)
          DB_USER=$(echo "$CREDS" | jq -r .username)
          DB_PASS=$(echo "$CREDS" | jq -r '.password | @uri')
          echo "::add-mask::$DB_PASS"
          aws secretsmanager put-secret-value \
            --secret-id "$PROJECT/database-url-owner" \
            --secret-string "postgresql://$DB_USER:$DB_PASS@$ENDPOINT:5432/sentinel_watch" >/dev/null
          echo "Owner DB secret realigned with the current master password."

      - name: Run database migrations (one-off task, owner role)
        run: |
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=$PROJECT-private-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$PROJECT-worker-*" \
            --query 'SecurityGroups[0].GroupId' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$PROJECT" \
            --task-definition "$PROJECT-migrate" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$PROJECT" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$PROJECT" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migrations failed (exit $EXIT_CODE) — check /ecs/$PROJECT/worker logs (migrate prefix)"
            exit 1
          fi

      - name: Release services
        run: |
          aws ecs update-service --cluster "$PROJECT" --service web \
            --force-new-deployment >/dev/null
          aws ecs update-service --cluster "$PROJECT" --service worker \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$PROJECT" --services web worker
          echo "Deployed $GITHUB_SHA"
